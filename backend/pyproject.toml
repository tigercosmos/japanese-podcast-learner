[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-learner"
version = "0.0.0"
description = "Backend for the Japanese podcast learner web app"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sudachidict-core>=20250129",
    "sudachipy>=0.7",
    "uvicorn[standard]>=0.32",
    "yt-dlp>=2025.1.15",
]

[project.optional-dependencies]
dev = [
    "flake8>=7",
    "httpx>=0.27",
    "pytest>=8",
]
# Local speech-to-text on Apple Silicon. Needed only for videos that have no
# Japanese subtitles.
whisper = [
    "mlx-whisper>=0.4",
]

[tool.setuptools.packages.find]
include = ["podcast_learner*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

